<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101714">

    <title>Sign In — StreetSpot</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .login-wrapper {
            min-height: 85vh;
            display: grid;
            place-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .login-card h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login-card p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            background: var(--bg);
            color: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
        }

        .login-card input:focus {
            border-color: var(--green);
        }

        .login-card button {
            width: 100%;
            margin-top: 18px;
        }

        .login-message {
            margin-top: 18px;
            font-size: 13px;
            color: var(--green);
        }
    </style>
</head>

<body>

    <div id="app">

        <header class="topbar">
            <a href="/" class="brand">
                <span class="brand-icon">📍</span>
                <span>Street<span class="brand-highlight">Spot</span></span>
            </a>
        </header>

        <main class="login-wrapper">

            <section class="login-card">

                <p class="eyebrow">WELCOME TO STREETSPOT</p>

                <h1>Discover what's nearby.</h1>

                <p>
                    Sign in to explore local vendors or make your own
                    street stall visible to nearby customers.
                </p>

                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <button
                    type="button"
                    id="login-button"
                    class="primary-button"
                >
                    Continue with email
                </button>

                <div
                    id="login-message"
                    class="login-message"
                    role="status"
                ></div>

            </section>

        </main>

    </div>

    <script>
        const button = document.getElementById("login-button");
        const emailInput = document.getElementById("email");
        const message = document.getElementById("login-message");

        button.addEventListener("click", async () => {
            const email = emailInput.value.trim();

            if (!email || !emailInput.checkValidity()) {
                message.textContent = "Please enter a valid email address.";
                return;
            }

            const auth = window.hatchable?.auth;

            if (!auth) {
                message.textContent =
                    "Authentication is unavailable. Please open StreetSpot through Hatchable.";
                return;
            }

            button.disabled = true;
            message.textContent = "Starting sign-in...";

            try {
                // Start Hatchable's email authentication flow.
                await auth.signInWithEmail(email);

                message.textContent =
                    "Check your email and follow the sign-in instructions.";

            } catch (error) {
                console.error(error);
                message.textContent =
                    error.message || "Unable to start sign-in.";
            } finally {
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
